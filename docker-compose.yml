# Earful on any machine with Docker: docker compose up -d, then open http://<this machine>:4180
services:
  earful:
    image: ghcr.io/ernani1234/earful:latest
    # Or build it from this folder instead:
    # build: .
    container_name: earful
    ports:
      - "4180:4180"
    volumes:
      - earful-data:/data # library: playlists, favorites, history
      - earful-cache:/cache # HD videos already downloaded
    environment:
      # Optional, see the README: cookies for YouTube's bot checks, region for search results.
      # YTDLP_EXTRA_ARGS: "--cookies /data/cookies.txt"
      # EARFUL_LOCATION: "US"
      EARFUL_CACHE_MAX_MB: "2048"
    restart: unless-stopped

volumes:
  earful-data:
  earful-cache:
